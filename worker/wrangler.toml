name = "ping-to-call"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# ---------------------------------------------------------------------------
# Non-secret configuration.
# ---------------------------------------------------------------------------
[vars]
# Public base URL of this Worker (used to build OAuth redirect URIs and the
# per-user /ingest URL shown in the wizard). Set after your first deploy.
APP_BASE_URL = "https://ping-to-call.example.workers.dev"

# Entra tenant: "common" for a multi-tenant app (any org), or a specific tenant id.
ENTRA_TENANT = "common"

# ---------------------------------------------------------------------------
# D1 database (users, senders, settings, schedules, tokens, call log).
# Create once:  wrangler d1 create ping-to-call
# then paste the returned database_id below, and apply migrations:
#   wrangler d1 migrations apply ping-to-call --remote
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "ping-to-call"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# KV namespace for de-dupe + rate-limit state.
# Create once:  wrangler kv namespace create PING_KV
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "PING_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# ---------------------------------------------------------------------------
# Static SPA assets. Build first:  (cd ../web && npm install && npm run build)
# The SPA handles all non-API routes; API/ingest/health are handled by the Worker.
# ---------------------------------------------------------------------------
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Secrets — set each with `wrangler secret put <NAME>`:
#   ENC_KEY             base64 of 32 random bytes (encrypts stored Twilio creds)
#                       generate: openssl rand -base64 32
#   SESSION_SECRET      long random string for signing session cookies
#                       generate: openssl rand -hex 32
#   ENTRA_CLIENT_ID     Entra app registration client id
#   ENTRA_CLIENT_SECRET Entra app registration client secret
# ---------------------------------------------------------------------------
