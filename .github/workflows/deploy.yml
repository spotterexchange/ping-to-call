name: Deploy to Cloudflare

# Auto-deploy when the app code changes on main. Also runnable on demand.
# One-time setup: add a repo secret CLOUDFLARE_API_TOKEN (Settings → Secrets and
# variables → Actions). Optionally add CLOUDFLARE_ACCOUNT_ID if your token maps to
# more than one account. App secrets (ENC_KEY, SESSION_SECRET) are NOT set here —
# they already live on the Worker and persist across deploys.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install worker deps
        working-directory: worker
        run: npm ci

      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply ping-to-call --remote

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy
